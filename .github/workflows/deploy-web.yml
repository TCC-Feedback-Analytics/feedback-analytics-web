name: Deploy Web (Vercel)

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite ok para confirmar deploy."
        required: true
        type: string

concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-web:
    runs-on: ubuntu-latest

    steps:
      - name: Validação manual de requests
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Este workflow deve ser executado apenas na branch main (produção)."
            exit 1
          fi

          if [ "${{ github.event.inputs.confirm_deploy }}" != "ok" ]; then
            echo "Confirme o deploy informando ok"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Resolver @feedback/lib-shared (ssh->https, repo público)
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci

      - name: Deploy production (main)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: npx vercel deploy --yes --prod --token "$VERCEL_TOKEN" --local-config vercel.json
